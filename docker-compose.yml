version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lpsk-website:prod
    container_name: lpsk-app
    expose:
      - "9000"
    volumes:
      - app_public:/var/www/public
    networks:
      - appnet

  nginx:
    image: nginx:stable-alpine
    container_name: lpsk-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/public:ro
    depends_on:
      - app
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  app_public:
